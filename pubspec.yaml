name: smart_food_demo
description: A database-backed food discovery app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  razorpay_flutter: ^1.4.7
  socket_io_client: ^3.1.6
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/BricolageGrotesque-OFL.txt
    - assets/fonts/Sora-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    - assets/images/food/
    - assets/images/restaurants/
    - assets/images/categories/
    - assets/images/hero/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
